on: [push]

jobs:

  windows_amd64:
    name: Windows (amd64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Mesa3D
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.2/mesa3d-26.1.2-release-msvc.7z" -OutFile "$env:TEMP\mesa3d.7z"
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\mesa3d.7z" "-o$env:TEMP\mesa3d" -y
          & $env:TEMP\mesa3d\systemwidedeploy.cmd 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup Python Virtual Environment
        shell: cmd
        run: cd %GITHUB_WORKSPACE% && python -m venv .venv && call .venv\Scripts\activate && pip install -r requirements\all_requirements.txt

      - name: Build Dependencies
        shell: cmd
        run: cd %GITHUB_WORKSPACE%/third_party && call %GITHUB_WORKSPACE%/scripts/env_vs-x64.bat && cmake --workflow --preset Release-Windows-amd64

      - name: Build Project
        shell: cmd
        run: |
          cd %GITHUB_WORKSPACE% && call %GITHUB_WORKSPACE%/opynsim/scripts/env_vs-x64.bat && cmake --workflow --preset Release-Windows-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: opynsim-windows-wheel
          path: build/Release/*win_amd64.whl
          if-no-files-found: error

  macos_arm64:
    name: MacOS (arm64)
    runs-on: macos-14
    env:
      CTEST_PARALLEL_LEVEL: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup Python Virtual Environment
        run: cd ${GITHUB_WORKSPACE} && python -m venv .venv && source .venv/bin/activate && pip install -r requirements/all_requirements.txt

      - name: Build Dependencies
        run: cd ${GITHUB_WORKSPACE}/third_party && cmake --workflow --preset Release-MacOS-amd64

      - name: Build Project
        run: cd ${GITHUB_WORKSPACE} && cmake --workflow --preset Release-MacOS-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: opynsim-macos-arm64-wheel
          path: build/Release-MacOS-arm64/*macosx_14_0_arm64.whl
          if-no-files-found: error

  manylinux_amd64:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_34_x86_64
    env:
      # Filter out tests that require OpenGL 3.3 support (manylinux
      # runner doesn't support it).
      OPYN_TEST_EXCLUDE_FILTER: "RenderQueueFixture|Graphics|MaterialTest|MeshDepthWritingMaterialFixture|MeshNormalVectorsMaterialFixture|ShaderTest|RegisteredDemoTabsTest"
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          yum install -y epel-release
          yum install -y ninja-build

      - name: Run Build Script
        run: PATH=/opt/python/cp312-cp312/bin:${PATH} ./scripts/e2e_setup-and-build-unix.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opynsim-manylinux-wheel
          path: build/Release/*manylinux_2_34_x86_64.whl
          if-no-files-found: error
